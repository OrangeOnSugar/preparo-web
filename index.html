<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Preparo — тренажёр для подготовки к экзаменам: карточки, заучивание, экзамен на время, синхронизация с iPhone.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Preparo">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Preparo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a module home page with mode tiles; study modes take over one centered column under a sticky mode bar */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EDF0F6; --fg:#1F2633; --muted:#5D6779; --line:#DCE1EA;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DFF0F1;
  --ok:#18794E; --ok-soft:#E3F4EA; --bad:#C4320A; --bad-soft:#FDECE6;
  --warn:#A15C00; --warn-soft:#FBF0DA; --star:#E3A008; --code:#EEF1F5;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.07);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E27; --sunk:#121820; --fg:#E6EAF0; --muted:#97A2B2; --line:#283240;
  --accent:#5CC6CF; --accent-ink:#04191B; --accent-soft:#123239;
  --ok:#5ED19A; --ok-soft:#113022; --bad:#FF8F73; --bad-soft:#3A1B14;
  --warn:#F0B055; --warn-soft:#33260F; --star:#F5C04A; --code:#1D2632;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --sunk:#121820; --fg:#E6EAF0; --muted:#97A2B2; --line:#283240;
  --accent:#5CC6CF; --accent-ink:#04191B; --accent-soft:#123239;
  --ok:#5ED19A; --ok-soft:#113022; --bad:#FF8F73; --bad-soft:#3A1B14;
  --warn:#F0B055; --warn-soft:#33260F; --star:#F5C04A; --code:#1D2632;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.in-mode::before{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
pre{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--code);padding:12px 14px;border-radius:10px;overflow-x:auto;margin:0;text-align:left}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.okc{color:var(--ok)} .badc{color:var(--bad)} .warnc{color:var(--warn)}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
body.in-mode header.top{display:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:600}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-current="page"]{color:var(--fg);background:var(--sunk)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--ok)} .sync.error i{background:var(--bad)} .sync.local i{background:var(--warn)}

main.wrap{padding-block:24px 80px;display:flex;flex-direction:column;gap:22px}
body.in-mode main.wrap{padding-top:0;gap:18px;max-width:860px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1,.h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,4vw,32px);line-height:1.2;margin:4px 0 6px;letter-spacing:-.01em}
.meta{color:var(--muted)}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:18px;font-weight:600}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:0;max-width:72ch}

.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:0;border-bottom:3px solid transparent;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-height:136px;transition:transform .15s,border-color .15s;min-width:0}
.mode:hover:not([disabled]){transform:translateY(-2px);border-bottom-color:var(--accent)}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode-ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.mode-t{font-weight:600;font-size:16px}
.mode-d{font-size:13px;color:var(--muted);line-height:1.4}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--fg);display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn .num{color:var(--muted);font-size:12px}
.chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-btn[aria-pressed="true"] .num{color:inherit;opacity:.8}
.toggles{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.switch input:disabled~*{opacity:.5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.seg-row{display:inline-flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}

.prog3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.prog3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.prog3>div{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.prog3 b{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.prog3 span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--line);display:flex;overflow:hidden}
.bar.big{height:12px}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .l{background:var(--warn)}
.secs{display:flex;flex-direction:column;margin:0 -8px}
.secrow{display:grid;grid-template-columns:minmax(0,1fr) 160px 64px;gap:12px;align-items:center;padding:9px 8px;border-radius:10px;border:0;background:none;text-align:left;width:100%}
.secrow:hover{background:var(--sunk)}
.secrow .nm{font-weight:500;min-width:0}
.secrow .ct{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:600px){.secrow{grid-template-columns:minmax(0,1fr) 56px;gap:6px 12px}.secrow .bar{grid-column:1/-1;grid-row:2}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--sunk)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6;font-weight:400}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--fg)}
.star{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.star:hover{background:var(--sunk);color:var(--fg)}
.star.on{color:var(--star)}
.star.on svg{fill:currentColor}

.modebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px 12px;padding-block:12px}
.mb-l{display:flex;align-items:center;gap:10px;min-width:0}
.mb-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-c{font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:14px;align-items:center}
.mb-r{justify-self:end;display:flex;gap:6px;align-items:center}
@media (max-width:520px){.modebar{grid-template-columns:minmax(0,1fr) auto}.mb-c{grid-column:1/-1;grid-row:2;justify-content:center}}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:-8px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}

.flip{perspective:1600px;cursor:pointer;outline:none}
.flip-inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);min-height:min(56vh,440px);padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.face.back{transform:rotateY(180deg)}
.flip:focus-visible .face{outline:2px solid var(--accent);outline-offset:3px}
.face-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.face-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:70ch;margin:0 auto;width:100%;min-width:0}
.fq{font-size:clamp(18px,2.4vw,23px);font-weight:500;line-height:1.4;text-align:center;overflow-wrap:anywhere}
.fa{font-size:clamp(18px,2.3vw,22px);font-weight:600;line-height:1.4;text-align:center;color:var(--ok);overflow-wrap:anywhere}
.fe{font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.face-hint{text-align:center;font-size:12px;color:var(--muted)}
.fopts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;text-align:left}
.fopts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:8px;background:var(--sunk)}
.fopts li.c{background:var(--ok-soft);color:var(--ok);font-weight:600}
.cardctl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 56px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;position:relative;min-width:0}
.big-btn.learn{color:var(--bad)}
.big-btn.learn:hover{border-color:var(--bad);background:var(--bad-soft)}
.big-btn.know{color:var(--ok)}
.big-btn.know:hover{border-color:var(--ok);background:var(--ok-soft)}
.big-btn .cnt{position:absolute;top:50%;transform:translateY(-50%);min-width:32px;padding:2px 8px;border-radius:999px;font-size:13px;background:var(--sunk);color:var(--fg)}
.big-btn.learn .cnt{left:12px}
.big-btn.know .cnt{right:12px}
@media (max-width:520px){.big-btn kbd{display:none}.big-btn{padding:14px 46px;font-size:15px}}
.cardtools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

.qcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:520px){.qcard{padding:18px 16px}.face{padding:16px}}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.qmeta .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600;font-size:12px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:clamp(17px,2.2vw,20px);font-weight:600;line-height:1.45;max-width:70ch;overflow-wrap:anywhere}
.opts-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:-6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.opt{width:100%;text-align:left;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .t.mono{font-family:var(--f-mono);font-size:13.5px}
.opt .mk{display:flex}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mk{color:var(--bad)}
.opt.dim{opacity:.55}
.qfoot{display:flex;justify-content:flex-end}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--ok-soft)} .feedback.bad{background:var(--bad-soft)}
.fb-h{font-weight:700;font-size:16px}
.feedback.ok .fb-h{color:var(--ok)} .feedback.bad .fb-h{color:var(--bad)}
.feedback p{margin:0;max-width:70ch}
.fb-act{display:flex;justify-content:flex-end}

.done{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-width:0}
.done h2{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,3vw,28px)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.mini{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:6px}
.mini li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14px;align-items:start}
.mini .ic{width:18px;height:18px;margin-top:2px}

.timer{font-family:var(--f-display);font-weight:500;font-size:20px}
.timer.warn{color:var(--bad)}
.qnum{font-size:13px;color:var(--muted);font-weight:600}
.testlist{display:flex;flex-direction:column;gap:14px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--warn-soft)}
.confirm span{flex:1 1 220px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted)}
.grid button.r-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.grid button.r-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.big{font-family:var(--f-display);font-weight:500;font-size:48px;line-height:1.1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:13px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.result{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input{width:96px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.review{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rv{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rv .q{font-weight:600;max-width:70ch}
.rv .a{font-size:14px;display:flex;flex-direction:column;gap:2px}
.rv .a .y{color:var(--bad)} .rv .a .c{color:var(--ok)}
.rv .e{font-size:14px;color:var(--muted);max-width:70ch}

.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters input,.filters select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.filters input{flex:1 1 260px}
.filters select{flex:0 1 auto;max-width:100%}
.termlist{display:flex;flex-direction:column;gap:10px}
.term{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;min-width:0}
.term.nosel{grid-template-columns:minmax(0,1fr) auto}
.term>input{margin:18px 0 0 14px;width:16px;height:16px;accent-color:var(--accent)}
.term-main{border:0;background:none;text-align:left;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;padding:14px 16px;width:100%;min-width:0;border-radius:14px}
.term-q,.term-a{display:block;min-width:0;overflow-wrap:anywhere}
.term-q .s{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.term-a{border-left:1px solid var(--line);padding-left:16px}
@media (max-width:640px){.term-main{grid-template-columns:minmax(0,1fr);gap:8px}.term-a{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:8px}}
.term-side{display:flex;align-items:center;gap:4px;padding:8px 8px 0 0}
@media (max-width:520px){.term-side .chip{display:none}}
.term-body{grid-column:1/-1;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.term-body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.term-body li.c{color:var(--ok);font-weight:600}
.term-body .e{color:var(--muted);font-size:14px;max-width:72ch}
.seltools{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:14px}
.seltools .chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.seltools .chk input{width:16px;height:16px;accent-color:var(--accent)}
.seldanger{color:var(--bad);font-weight:600}
.qactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel textarea{width:100%;min-height:140px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--f-mono);font-size:13px;resize:vertical}
.msg{font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
#imp-panel.drag{outline:2px dashed var(--accent);background:var(--accent-soft)}
.empty{padding:28px 0;color:var(--muted);text-align:center}
.brand{border:0;background:none;padding:0;cursor:pointer;color:var(--fg)}
.crumb{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 180px;font-weight:600}

.crumb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.testcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;text-align:left}
.tc-main{border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:8px;padding:18px 18px 10px;border-radius:var(--r);flex:1;width:100%;min-width:0}
.tc-main:hover .tc-name{color:var(--accent)}
.tc-name{font-weight:700;font-size:17px;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.tc-desc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tc-meta,.tc-foot{font-size:13px;color:var(--muted)}
.tc-main .bar{margin-top:4px}
.tc-actions{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 10px}
.tc-actions .confirm{width:100%}
.newcard{align-items:flex-start;justify-content:center;gap:6px;padding:18px;border:2px dashed var(--line);background:none;box-shadow:none;min-height:180px;cursor:pointer;color:var(--fg)}
.newcard:hover{border-color:var(--accent)}
.plus{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;font-weight:600}
.tform{padding:18px;gap:12px}
.tform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.tform input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px;color:var(--fg)}
button.sync{border:0;background:none;cursor:pointer;padding:6px 10px;border-radius:9px;font:inherit;font-size:12px}
button.sync:hover{background:var(--sunk);color:var(--fg)}
.sync.connecting i{background:var(--accent)}
.account h2{margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<main class="wrap" id="app"></main>

<script>
(function(){
'use strict';

/* ---------- Банк вопросов ---------- */
const SECTIONS=[
 ['apps','1. Эксплуатация серверов приложений'],
 ['cluster','2. Эксплуатация кластера серверов'],
 ['dbms','3. Эксплуатация серверов СУБД'],
 ['qa','4. Обеспечение качества и его инструменты'],
 ['perf','5. Производительность'],
 ['query','6. Запросы и методы их оптимизации'],
 ['idx','7. Индексы'],
 ['trans','8. Транзакции'],
 ['locks','9. Блокировки и их оптимизация'],
 ['dead','10. Взаимоблокировки и их исправление'],
 ['load','11. Нагрузочное тестирование'],
 ['invperf','12. Расследование проблем производительности'],
 ['invpar','13. Расследование проблем параллельной работы'],
 ['std','14. Стандарты разработки'],
 ['my','Мои вопросы']
];
const SECNAME={}; SECTIONS.forEach(function(s){SECNAME[s[0]]=s[1];});

// [id, раздел, вопрос, варианты, индекс верного, пояснение, код]
const RAW=[];

const BANK=RAW.map(function(r){return {id:r[0],s:r[1],q:r[2],o:r[3],a:r[4],e:r[5]||'',c:r[6]||'',mine:false};});

/* ---------- Состояние ---------- */
let custom=[];
let QMAP={},ALL=[];
const TECH_ID='tech',TECH_NAME='Основной тест';
function qTest(q){return q.t||TECH_ID;}
function allQ(){return ALL;}
function testQs(id){
  const hidden={};(P.hidden||[]).forEach(function(h){hidden[h]=1;});
  return (id===TECH_ID?BANK.filter(function(q){return !hidden[q.id];}):[]).concat(custom.filter(function(q){return qTest(q)===id;}));
}
function reindex(){
  QMAP={};BANK.concat(custom).forEach(function(q){QMAP[q.id]=q;});
  ALL=testQs((typeof ui!=='undefined'&&ui.test)||TECH_ID);
}

const DEF_SETTINGS={count:14,minutes:30,pass:12,batch:10,shuffleOpts:true,shuffleQs:true,scope:[],starOnly:false};
function freshProgress(){return {v:1,stats:{},exams:[],hidden:[],starred:{},tests:[],scopes:{},settings:Object.assign({},DEF_SETTINGS),updatedAt:0};}
function normalizeP(x){
  const p=freshProgress();
  if(x&&typeof x==='object'){
    if(x.stats&&typeof x.stats==='object') p.stats=x.stats;
    if(Array.isArray(x.exams)) p.exams=x.exams.slice(-50);
    if(Array.isArray(x.hidden)) p.hidden=x.hidden.filter(function(v){return typeof v==='string';});
    if(x.starred&&typeof x.starred==='object'&&!Array.isArray(x.starred)) p.starred=x.starred;
    if(!Array.isArray(p.settings.scope)) p.settings.scope=[];
    if(x.settings&&typeof x.settings==='object') Object.assign(p.settings,x.settings);
    if(Array.isArray(x.tests)) p.tests=x.tests.filter(function(t){return t&&typeof t.id==='string'&&typeof t.name==='string';}).map(function(t){return {id:t.id,name:t.name,desc:String(t.desc||''),ts:+t.ts||0,order:Array.isArray(t.order)?t.order.filter(function(v){return typeof v==='string';}):undefined};});
    if(x.starTs&&typeof x.starTs==='object') p.starTs=x.starTs;
    if(x.sync&&typeof x.sync==='object') p.sync=x.sync;
    if(x.scopes&&typeof x.scopes==='object'&&!Array.isArray(x.scopes)) p.scopes=x.scopes;
    else if(Array.isArray(p.settings.scope)&&p.settings.scope.length) p.scopes={tech:p.settings.scope.slice()};
    p.updatedAt=+x.updatedAt||0;
  }
  return p;
}
let P=freshProgress();
const clone=function(o){return JSON.parse(JSON.stringify(o));};

const ui={auth:{email:'',msg:'',err:false,busy:false},view:'tests',test:TECH_ID,testForm:null,testDel:null,mode:null,cards:null,learn:null,exam:null,examConfirm:false,closeConfirm:false,bank:{q:'',s:'all',f:'all',sel:{},open:null,delOne:null,confirmSel:false,msg:'',selecting:false},imp:{text:'',msg:'',ok:true},confirmReset:false,confirmDel:false,copyMsg:''};

/* ---------- Хранение ---------- */
const LS_KEY='preparo:v1';
function lsLoad(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({progress:P,custom:custom}));}catch(e){}}

/* ---------- Синхронизация (Supabase) ---------- */
const SUPA_URL='https://drlxqcqhshapdwezvyrh.supabase.co';
const SUPA_KEY='sb_publishable_Fb7lylU7Ihf4W_1nsyXTeQ_skUdqW1I';
const SESSION_KEY='preparo:session';
const SYNC_KINDS=['tests','questions','progress','stars','exams'];
let session=null,syncing=false,syncTimer=null,lastSyncAt=null,syncError=null;

function loadSession(){try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){session=null;}}
function saveSession(){try{if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));else localStorage.removeItem(SESSION_KEY);}catch(e){}}
function uuid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});}
function fnv64(s){let h=0xcbf29ce484222325n;const p=0x100000001b3n;for(const b of new TextEncoder().encode(s)){h^=BigInt(b);h=(h*p)&0xffffffffffffffffn;}return h.toString(36);}
function questionKey(tid,text,options){return tid+':'+fnv64(text+'\u0001'+options.join('\u0001'));}
function syncState(){
  const s=P.sync=P.sync||{};
  s.lastPull=s.lastPull||{};s.d=s.d||{};s.delQ=s.delQ||{};s.delT=s.delT||{};
  SYNC_KINDS.forEach(function(k){s.d[k]=s.d[k]||{};});
  return s;
}
function mark(kind,id){syncState().d[kind][id]=Date.now();}
function hasPending(){const s=syncState();return SYNC_KINDS.some(function(k){return Object.keys(s.d[k]).length;})||Object.keys(s.delQ).length>0||Object.keys(s.delT).length>0;}
function iso(ms){return new Date(ms).toISOString();}
function msOf(s){if(!s)return 0;const t=Date.parse(String(s).replace(/(\.\d{3})\d+/,'$1'));return isNaN(t)?0:t;}
function techOrder(){return Object.keys(TECH_OFFICIAL).filter(function(k){return k!=='my';}).map(function(k){return TECH_OFFICIAL[k];});}

function supaErr(j,status){
  const raw=(j&&(j.error_description||j.msg||j.message||j.error))||('Ошибка сервера ('+status+')');
  const l=String(raw).toLowerCase();
  if(l.indexOf('invalid login credentials')>=0) return 'Неверный e-mail или пароль.';
  if(l.indexOf('email not confirmed')>=0) return 'Подтвердите e-mail по ссылке из письма и войдите снова.';
  if(l.indexOf('already registered')>=0||l.indexOf('already been registered')>=0) return 'Пользователь с таким e-mail уже есть. Войдите.';
  if(l.indexOf('password should be')>=0||l.indexOf('weak')>=0) return 'Слишком простой пароль: нужно не меньше 6 символов.';
  if(l.indexOf('rate limit')>=0) return 'Слишком много попыток. Подождите минуту и повторите.';
  if(l.indexOf('refresh token')>=0) return 'Сессия истекла. Войдите снова.';
  if(l.indexOf('could not find the table')>=0) return 'На сервере ещё нет таблиц: выполните schema.sql в Supabase.';
  return String(raw);
}
async function supa(path,o){
  o=o||{};
  const headers={apikey:SUPA_KEY};
  if(o.token) headers.Authorization='Bearer '+o.token;
  if(o.prefer) headers.Prefer=o.prefer;
  let body;
  if(o.body!==undefined){headers['Content-Type']='application/json';body=JSON.stringify(o.body);}
  let r;
  try{r=await fetch(SUPA_URL+path,{method:o.method||'GET',headers:headers,body:body});}
  catch(e){throw new Error('Нет связи с сервером. Проверьте интернет.');}
  const txt=await r.text();let j=null;
  try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok) throw new Error(supaErr(j,r.status));
  return j;
}
function toSession(j){
  if(!j||!j.access_token||!j.user) throw new Error('Неожиданный ответ сервера');
  return {access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user.id,email:j.user.email||''};
}
async function signIn(email,pw){
  session=toSession(await supa('/auth/v1/token?grant_type=password',{method:'POST',body:{email:email,password:pw}}));
  saveSession();adopt();await sync();
}
async function signUp(email,pw){
  const j=await supa('/auth/v1/signup',{method:'POST',body:{email:email,password:pw}});
  if(j&&j.access_token){session=toSession(j);saveSession();adopt();await sync();return true;}
  return false;
}
async function signOut(){
  if(session){try{await supa('/auth/v1/logout',{method:'POST',token:session.access});}catch(e){}}
  session=null;saveSession();lastSyncAt=null;syncError=null;render();
}
/** Новый аккаунт в этом браузере: отправляем всё локальное и забираем всё серверное. */
function adopt(){
  const s=syncState();
  if(s.uid===session.uid) return;
  s.uid=session.uid;s.lastPull={};
  const now=Date.now();
  P.tests.forEach(function(t){s.d.tests[t.id]=now;});
  custom.forEach(function(q){s.d.questions[q.id]=now;});
  Object.keys(P.stats).forEach(function(k){s.d.progress[k]=now;});
  Object.keys(P.starred||{}).concat(Object.keys(P.starTs||{})).forEach(function(k){s.d.stars[k]=now;});
  P.exams.forEach(function(e){if(!e.id)e.id=uuid();s.d.exams[e.id]=now;});
  lsSave();
}
function scheduleSync(){if(!session)return;clearTimeout(syncTimer);syncTimer=setTimeout(sync,4000);}
async function sync(){
  if(!session||syncing) return;
  syncing=true;updateSyncBadge();
  try{
    if(session.exp<Date.now()+120000){
      session=toSession(await supa('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh}}));
      saveSession();
    }
    await pushChanges();
    await pullChanges();
    lastSyncAt=Date.now();syncError=null;lsSave();
  }catch(e){
    syncError=e.message;
    if(/Войдите снова/.test(e.message)){session=null;saveSession();}
  }
  syncing=false;
  if(!ui.mode) render(); else updateSyncBadge();
}
async function upsertRows(table,conflict,rows){
  for(let i=0;i<rows.length;i+=200){
    await supa('/rest/v1/'+table+'?on_conflict='+conflict,{method:'POST',token:session.access,prefer:'resolution=merge-duplicates,return=minimal',body:rows.slice(i,i+200)});
  }
}
async function pushChanges(){
  if(!hasPending()) return;
  const s=syncState();
  const snap=JSON.parse(JSON.stringify({d:s.d,delQ:s.delQ,delT:s.delT}));
  const uid=session.uid,now=iso(Date.now());
  const tests=[];
  Object.keys(snap.d.tests).forEach(function(id){
    const t=P.tests.find(function(x){return x.id===id;});if(!t) return;
    tests.push({user_id:uid,id:t.id,name:t.name,descr:t.desc||'',section_order:t.order||(t.id===TECH_ID?techOrder():null),deleted:false,ts:iso(t.ts||0)});
  });
  Object.keys(snap.delT).forEach(function(id){tests.push({user_id:uid,id:id,name:'',descr:'',section_order:null,deleted:true,ts:iso(snap.delT[id])});});
  const byId={};custom.forEach(function(q){byId[q.id]=q;});
  const qs=[];
  Object.keys(snap.d.questions).forEach(function(id){
    const q=byId[id];if(!q) return;
    qs.push({user_id:uid,id:q.id,test_id:qTest(q),section:q.s,text:q.q,options:q.o,answer:q.a,explain:q.e||'',code:q.c||'',fixed:!!q.fix,deleted:false,ts:iso(q.ts||Date.now())});
  });
  Object.keys(snap.delQ).forEach(function(id){qs.push({user_id:uid,id:id,test_id:id.split(':')[0],section:'',text:'',options:[],answer:0,explain:'',code:'',fixed:false,deleted:true,ts:iso(snap.delQ[id])});});
  const prog=Object.keys(snap.d.progress).map(function(id){
    const x=P.stats[id];
    return x?{user_id:uid,qkey:id,n:x.n,ok:x.ok,box:x.box,last:x.last==null?null:!!x.last,ts:iso(x.t)}:{user_id:uid,qkey:id,n:0,ok:0,box:0,last:null,ts:now};
  });
  const stars=Object.keys(snap.d.stars).map(function(id){return {user_id:uid,qkey:id,starred:!!(P.starred&&P.starred[id]),ts:iso((P.starTs&&P.starTs[id])||Date.now())};});
  const exams=P.exams.filter(function(e){return e.id&&snap.d.exams[e.id];}).map(function(e){return {user_id:uid,id:e.id,test_id:e.t||TECH_ID,ok:e.ok,n:e.n,pass:e.pass,seconds:Math.round((e.ms||0)/1000),ts:iso(e.d)};});
  if(tests.length) await upsertRows('tests','user_id,id',tests);
  if(qs.length) await upsertRows('questions','user_id,id',qs);
  if(prog.length) await upsertRows('progress','user_id,qkey',prog);
  if(stars.length) await upsertRows('stars','user_id,qkey',stars);
  if(exams.length) await upsertRows('exams','user_id,id',exams);
  // Убираем из очереди только отправленное: изменения во время отправки останутся.
  SYNC_KINDS.forEach(function(k){Object.keys(snap.d[k]).forEach(function(id){if(s.d[k][id]===snap.d[k][id]) delete s.d[k][id];});});
  Object.keys(snap.delQ).forEach(function(id){if(s.delQ[id]===snap.delQ[id]) delete s.delQ[id];});
  Object.keys(snap.delT).forEach(function(id){if(s.delT[id]===snap.delT[id]) delete s.delT[id];});
}
async function pullChanges(){
  const s=syncState();
  for(const table of SYNC_KINDS){
    let since=s.lastPull[table]?iso(msOf(s.lastPull[table])-60000):null;
    const rows=[];
    for(;;){
      let q='/rest/v1/'+table+'?select=*&order=synced_at.asc&limit=1000';
      if(since) q+='&synced_at=gt.'+encodeURIComponent(since);
      const page=await supa(q,{token:session.access})||[];
      rows.push.apply(rows,page);
      if(page.length<1000) break;
      since=page[page.length-1].synced_at;
    }
    if(!rows.length) continue;
    MERGE[table](rows,s);
    s.lastPull[table]=rows[rows.length-1].synced_at;
  }
  reindex();
}
const MERGE={
  tests:function(rows,s){
    rows.forEach(function(r){
      const ts=msOf(r.ts);
      if(s.d.tests[r.id]||s.delT[r.id]) return;
      const local=P.tests.find(function(t){return t.id===r.id;});
      if(local&&(local.ts||0)>=ts) return;
      if(r.deleted){
        P.tests=P.tests.filter(function(t){return t.id!==r.id;});
        custom=custom.filter(function(q){return qTest(q)!==r.id;});
        if(P.scopes) delete P.scopes[r.id];
        return;
      }
      const order=Array.isArray(r.section_order)?r.section_order:(local&&local.order);
      if(local){local.name=r.name;local.desc=r.descr||'';local.ts=ts;local.order=order;}
      else P.tests.push({id:r.id,name:r.name,desc:r.descr||'',ts:ts,order:order});
    });
  },
  questions:function(rows,s){
    const index={};custom.forEach(function(q,i){index[q.id]=i;});
    const removed={};
    rows.forEach(function(r){
      const ts=msOf(r.ts);
      if(s.d.questions[r.id]||s.delQ[r.id]) return;
      const i=index[r.id];
      if(i!=null&&(custom[i].ts||0)>=ts) return;
      if(r.deleted){if(i!=null) removed[r.id]=1;return;}
      if(!Array.isArray(r.options)||!(r.answer>=0&&r.answer<r.options.length)) return;
      const q={id:r.id,t:r.test_id,s:r.section,q:r.text,o:r.options,a:r.answer,e:r.explain||'',c:r.code||'',fix:!!r.fixed,mine:true,ts:ts};
      if(i!=null) custom[i]=q; else {index[r.id]=custom.length;custom.push(q);}
      if(!P.tests.some(function(t){return t.id===r.test_id;})) P.tests.push({id:r.test_id,name:'Тест',desc:'',ts:0});
    });
    if(Object.keys(removed).length) custom=custom.filter(function(q){return !removed[q.id];});
  },
  progress:function(rows,s){
    rows.forEach(function(r){
      const ts=msOf(r.ts);
      if(s.d.progress[r.qkey]) return;
      const local=P.stats[r.qkey];
      if(local&&(local.t||0)>=ts) return;
      if(!r.n){delete P.stats[r.qkey];return;}
      P.stats[r.qkey]={n:r.n,ok:r.ok,box:r.box,last:r.last==null?null:(r.last?1:0),t:ts};
    });
  },
  stars:function(rows,s){
    P.starred=P.starred||{};P.starTs=P.starTs||{};
    rows.forEach(function(r){
      const ts=msOf(r.ts);
      if(s.d.stars[r.qkey]) return;
      if((P.starTs[r.qkey]||0)>=ts) return;
      if(r.starred) P.starred[r.qkey]=1; else delete P.starred[r.qkey];
      P.starTs[r.qkey]=ts;
    });
  },
  exams:function(rows){
    const known={};P.exams.forEach(function(e){if(e.id) known[e.id]=1;});
    rows.forEach(function(r){
      if(known[r.id]) return;
      P.exams.push({id:r.id,d:msOf(r.ts),ok:r.ok,n:r.n,pass:r.pass,ms:(r.seconds||0)*1000,t:r.test_id});
      known[r.id]=1;
    });
    P.exams.sort(function(a,b){return a.d-b.d;});
  }
};

/* ---------- Утилиты ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function isCode(s){return /[(.&]/.test(s)&&/^[&\wА-Яа-яЁё.]+(\(.*\))?(\.[\wА-Яа-яЁё]+)?$/.test(s);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function range(n){const a=[];for(let i=0;i<n;i++)a.push(i);return a;}
function pct(a,b){return b?Math.round(a*100/b):0;}
function plural(n,f){const m10=n%10,m100=n%100;return f[(m10===1&&m100!==11)?0:(m10>=2&&m10<=4&&(m100<10||m100>=20))?1:2];}
function fmtDate(t){const d=new Date(t);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function mmss(ms){ms=Math.max(0,ms);const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
const DAY=86400000;
const INTERVAL=[0,0,DAY,3*DAY,7*DAY,14*DAY];

function stat(id){return P.stats[id];}
function record(id,good){
  const st=P.stats[id]||{n:0,ok:0,box:0,last:null,t:0};
  st.n++;if(good){st.ok++;st.box=Math.min(5,st.box+1);}else st.box=0;
  st.last=good?1:0;st.t=Date.now();P.stats[id]=st;
  mark('progress',id);
}
function isMastered(id){const s=stat(id);return !!s&&s.box>=3;}
function mistakesList(){return allQ().filter(function(q){const s=stat(q.id);return s&&s.n>s.ok&&s.box<3;});}
function sectionsInUse(){
  const qs=allQ();
  if(ui.test===TECH_ID){
    const used={};qs.forEach(function(q){used[q.s]=1;});
    const order=techOrder(),out=order.filter(function(n){return used[n];}).map(function(n){return [n,n];});
    Object.keys(used).filter(function(n){return order.indexOf(n)<0;}).sort().forEach(function(n){out.push([n,n]);});
    return out;
  }
  const seen={},out=[];qs.forEach(function(q){if(!seen[q.s]){seen[q.s]=1;out.push([q.s,q.s]);}});
  const order=(curTest()&&curTest().order)||[],byName=function(a,b){return a[0].localeCompare(b[0],'ru',{numeric:true});};
  if(order.length) return order.filter(function(n){return seen[n];}).map(function(n){return [n,n];}).concat(out.filter(function(x){return order.indexOf(x[0])<0;}).sort(byName));
  return out.sort(byName);
}
function getScope(){return ((P.scopes||{})[ui.test])||[];}
function setScope(a){P.scopes=P.scopes||{};P.scopes[ui.test]=a;persist('p');}
function statChip(id){
  const s=stat(id);
  if(!s) return '<span class="chip">новый</span>';
  if(s.box>=3) return '<span class="chip ok">выучен</span>';
  if(s.last===0) return '<span class="chip bad">ошибка · '+s.ok+'/'+s.n+'</span>';
  return '<span class="chip warn">'+s.ok+'/'+s.n+'</span>';
}

/* ---------- Подбор вопросов ---------- */
function scopeQs(){
  const sc=getScope(),st=P.settings.starOnly,stars=P.starred||{};
  return allQ().filter(function(q){return (!sc.length||sc.indexOf(q.s)>=0)&&(!st||stars[q.id]);});
}
function byPriority(list){
  const now=Date.now(),wrong=[],fresh=[],due=[],rest=[];
  list.forEach(function(q){
    const s=stat(q.id);
    if(!s) fresh.push(q.id);
    else if(s.last===0) wrong.push(q.id);
    else if(now-s.t>=INTERVAL[s.box]) due.push(q.id);
    else rest.push(q.id);
  });
  const byBox=function(a,b){const x=stat(a),y=stat(b);return (x.box-y.box)||(x.t-y.t);};
  wrong.sort(function(a,b){return stat(a).t-stat(b).t;});
  if(P.settings.shuffleQs!==false) shuffle(fresh);
  due.sort(byBox);rest.sort(byBox);
  return wrong.concat(fresh,due,rest);
}
function pickExam(n,pool){
  const by={};pool.forEach(function(q){(by[q.s]=by[q.s]||[]).push(q.id);});
  Object.keys(by).forEach(function(k){shuffle(by[k]);});
  const keys=shuffle(Object.keys(by));const out=[];
  while(out.length<n){let added=false;for(const k of keys){if(out.length>=n)break;if(by[k].length){out.push(by[k].pop());added=true;}}if(!added)break;}
  return shuffle(out);
}
function makeItems(ids){return ids.map(function(id){const n=QMAP[id].o.length;return {id:id,order:(QMAP[id].fix||P.settings.shuffleOpts===false)?range(n):shuffle(range(n))};});}

  if(P.settings.starOnly) t+=' · только отмеченные';

}

function starCount(){return Object.keys(P.starred||{}).filter(function(id){return QMAP[id];}).length;}
function mistakesIn(list){return list.filter(function(q){const s=stat(q.id);return s&&s.n>s.ok&&s.box<3;});}

/* ---------- Тест ---------- */
function startExam(){
  const s=P.settings,pool=scopeQs();
  const ids=pickExam(Math.min(s.count,pool.length),pool);if(!ids.length) return;
  ui.exam={items:makeItems(ids),picks:ids.map(function(){return null;}),start:Date.now(),deadline:Date.now()+s.minutes*60000,pass:Math.min(s.pass,ids.length),finished:false};
  ui.examConfirm=false;ui.closeConfirm=false;
  clearInterval(timerId);timerId=setInterval(tick,1000);
  render();window.scrollTo(0,0);
}
function tick(){
  const e=ui.exam;if(!e||e.finished){clearInterval(timerId);return;}
  const left=e.deadline-Date.now();
  if(left<=0){finishExam();return;}
  const el=document.getElementById('timer');
  if(el){el.textContent=mmss(left);el.classList.toggle('warn',left<120000);}
}
function finishExam(){
  const e=ui.exam;if(!e||e.finished) return;
  clearInterval(timerId);
  e.finished=true;e.end=Math.min(Date.now(),e.deadline);
  let ok=0;
  e.items.forEach(function(it,i){const q=QMAP[it.id];const good=e.picks[i]===q.a;if(good)ok++;record(q.id,good);});
  e.ok=ok;
  const exId=uuid();
  P.exams.push({id:exId,d:e.end,ok:ok,n:e.items.length,pass:e.pass,ms:e.end-e.start,t:ui.test});
  mark('exams',exId);
  P.exams=P.exams.slice(-50);
  ui.examConfirm=false;ui.closeConfirm=false;
  persist('p');render();window.scrollTo(0,0);
}
function testPick(qi,k){
  const e=ui.exam;if(!e||e.finished) return;
  e.picks[qi]=e.items[qi].order[k];
  const card=document.getElementById('tq-'+qi);
  if(card) card.querySelectorAll('.opt').forEach(function(b){b.classList.toggle('sel',+b.dataset.k===k);});
  const a=document.getElementById('answered');if(a) a.textContent=e.picks.filter(function(p){return p!=null;}).length+' / '+e.items.length;
}

function render(){
  if(!P.tests.some(function(t){return t.id===ui.test;})){ui.test=TECH_ID;ui.view='tests';ui.mode=null;reindex();}
  document.body.classList.toggle('in-mode',!!ui.mode);
  updateSyncBadge();

  if(tabs) tabs.hidden=!inTest;
  if(crumb){crumb.hidden=!inTest;crumb.innerHTML=inTest?'<span class="sep" aria-hidden="true">/</span><span class="crumb-name" title="'+esc(curTest().name)+'">'+esc(curTest().name)+'</span>':'';}
  document.querySelectorAll('#tabs button').forEach(function(b){
    if(b.dataset.v===ui.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });

  if(ui.mode==='cards') app.innerHTML=renderCards();

function keepSectionOrder(secs){

function saveTestForm(){
  const f=ui.testForm;if(!f) return;
  const nEl=document.getElementById('tf-name'),dEl=document.getElementById('tf-desc');
  const name=(nEl?nEl.value:'').replace(/\s+/g,' ').trim().slice(0,120),desc=(dEl?dEl.value:'').replace(/\s+/g,' ').trim().slice(0,300);
  if(!name){f.err='Введите название теста.';f.desc=desc;render();const e=document.getElementById('tf-name');if(e)e.focus();return;}
  if(f.id){
    const t=P.tests.find(function(x){return x.id===f.id;});

  }else{

function deleteTest(id){
  const gone={};custom.forEach(function(q){if(qTest(q)===id) gone[q.id]=1;});
  custom=custom.filter(function(q){return !gone[q.id];});
  const now=Date.now(),ss=syncState();
  Object.keys(gone).forEach(function(qid){delete P.stats[qid];if(P.starred) delete P.starred[qid];delete ss.d.questions[qid];ss.delQ[qid]=now;});
  delete ss.d.tests[id];ss.delT[id]=now;
  P.exams=P.exams.filter(function(x){return (x.t||TECH_ID)!==id;});
  if(P.scopes) delete P.scopes[id];
  P.tests=P.tests.filter(function(t){return t.id!==id;});

  ui.testDel=null;reindex();persist('c');persist('p');render();
}

function normTopic(v){return String(v).toLowerCase().replace(/ё/g,'е').replace(/^\s*\d+\s*[.)]?\s*/,'').replace(/\s+/g,' ').trim();}
function sectionOf(v){
  if(typeof v!=='string'||!v.trim()) return 'my';
  const t=normTopic(v);
  for(const s of SECTIONS){if(s[0]===t||normTopic(s[1])===t) return s[0];}
  for(const al of TOPIC_ALIASES){for(const w of al[1]){if(t.indexOf(w)>=0) return al[0];}}
  return 'my';
}
function hashStr(s){let h1=0,h2=7;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=(h1*31+c)|0;h2=(h2*131+c)|0;}return (h1>>>0).toString(36)+(h2>>>0).toString(36);}
const REF_RE=/(верн\S*|все|оба)\s+(ответ|вариант|перечисл|утвержд)|ответ\S*\s+\d|вариант\S*\s+\d|^нет\s+верн|^ни\s+один/i;
function short(t){t=String(t||'').replace(/\s+/g,' ').trim();return t.length>50?t.slice(0,50)+'…':t;}
function normQ(x,tid){
  tid=tid||TECH_ID;
  if(!x||typeof x!=='object'||Array.isArray(x)) throw new Error('элемент не является объектом');
  const q=x.question!=null?x.question:x.q;
  if(typeof q!=='string'||!q.trim()) throw new Error('нет текста вопроса (поле question)');
  let o=x.options||x.o,a=x.answer!=null?x.answer:x.a,labelled=false;
  if(Array.isArray(x.answers)){
    if(x.answers.length&&x.answers.every(function(v){return v&&typeof v==='object';})){
      o=x.answers.map(function(v){return typeof v.text==='string'?v.text:'';});
      labelled=x.answers.some(function(v){return v.label!=null&&v.label!=='';});
      const ok=[];x.answers.forEach(function(v,k){if(v.correct===true||v.correct==='true'||v.correct===1)ok.push(k);});
      if(!ok.length) throw new Error('не отмечен верный ответ');
      if(ok.length>1) throw new Error('отмечено несколько верных ответов, а тренажёр поддерживает один');
      a=ok[0];
    }else o=x.answers;
  }
  if(!Array.isArray(o)||o.length<2||o.length>9||o.some(function(v){return typeof v!=='string'||!v.trim();})) throw new Error('нужно от 2 до 9 непустых вариантов ответа');
  o=o.map(function(v){return v.trim();});
  if(typeof a==='string'&&!/^\d+$/.test(a)) a=o.indexOf(a.trim()); else a=+a;
  if(!(a>=0&&a<o.length)||a%1) throw new Error('неверно указан правильный ответ');
  const qt=q.trim();
  const fix=x.fix===true||labelled||o.some(function(t){return REF_RE.test(t);});
  const tech=tid===TECH_ID;
  const sec=tech?(TECH_OFFICIAL[sectionOf(x.topic||x.section||x.s)]||TECH_OFFICIAL.my):(String(x.section||x.topic||x.s||'').replace(/\s+/g,' ').trim().slice(0,120)||'Без раздела');
  return {id:questionKey(tid,qt,o),t:tid,ts:Date.now(),s:sec,q:qt,o:o,a:a,e:String(x.explain||x.explanation||x.e||''),c:String(x.code||x.c||''),fix:fix,mine:true};
}
function parseImport(text){
  text=String(text).replace(/^﻿/,'').trim();
  if(!text) return [];
  let data;
  try{data=JSON.parse(text);}
  catch(err){
    const lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2) throw err;
    data=lines.map(function(l,k){try{return JSON.parse(l);}catch(e){throw new SyntaxError('строка '+(k+1)+': '+e.message);}});
  }
  if(data&&!Array.isArray(data)&&Array.isArray(data.questions)) data=data.questions;
  return Array.isArray(data)?data:[data];
}
function importBatches(batches){
  const map={};custom.forEach(function(q){map[q.id]=q;});
  let added=0,replaced=0;const errors=[],fileSecs=[];
  batches.forEach(function(b){
    if(b.error){errors.push(b.name+': '+b.error);return;}
    b.items.forEach(function(x,k){
      try{const q=normQ(x,ui.test);if(map[q.id])replaced++;else added++;map[q.id]=q;mark('questions',q.id);delete syncState().delQ[q.id];if(fileSecs.indexOf(q.s)<0)fileSecs.push(q.s);}
      catch(e){errors.push(b.name+(b.items.length>1?', №'+(k+1):'')+(x&&(x.question||x.q)?' «'+short(x.question||x.q)+'»':'')+': '+e.message);}
    });
  });
  const next=Object.values(map);
  if(next.length>3000){ui.imp.msg='Слишком много своих вопросов: '+next.length+'. Тренажёр хранит до 3000.';ui.imp.ok=false;render();return;}
  if(added||replaced){custom=next;keepSectionOrder(fileSecs);reindex();persist('c');}
  const bySec={};
  let msg=(added||replaced)?'Добавлено: '+added+(replaced?', обновлено: '+replaced:'')+'.':'Ничего не добавлено.';
  if(errors.length) msg+='\nПропущено: '+errors.length+'.\n'+errors.slice(0,8).join('\n')+(errors.length>8?'\n…и ещё '+(errors.length-8):'');
  const toMy=ui.test===TECH_ID?allQ().filter(function(q){return q.s===TECH_OFFICIAL.my;}).length:0;
  if(toMy) msg+='\nВ «Мои вопросы» без раздела попало: '+toMy+' (не удалось определить раздел по полю topic).';
  ui.imp.msg=msg;ui.imp.ok=!errors.length&&(added||replaced)>0;
  render();
}
function doImport(){
  const ta=document.getElementById('imp');const text=ta?ta.value:'';ui.imp.text=text;
  let items;
  try{items=parseImport(text);}
  catch(err){ui.imp.msg='Не получилось разобрать JSON: '+err.message;ui.imp.ok=false;render();return;}
  if(!items.length){ui.imp.msg='Поле пустое: вставьте JSON или выберите файлы.';ui.imp.ok=false;render();return;}
  importBatches([{name:'Текст',items:items}]);
  if(ui.imp.ok){ui.imp.text='';render();}
}
function readFileText(f){
  if(f.text) return f.text();
  return new Promise(function(res,rej){const r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsText(f);});
}
async function importFiles(fileList){
  const files=Array.prototype.slice.call(fileList||[]);
  if(!files.length) return;
  ui.imp.msg='Читаю файлы: '+files.length+'…';ui.imp.ok=true;render();
  const batches=[];
  for(const f of files){
    try{batches.push({name:f.name,items:parseImport(await readFileText(f))});}
    catch(e){batches.push({name:f.name,error:(e instanceof SyntaxError?'не JSON ('+e.message+')':e.message)});}
  }
  importBatches(batches);
}
const TECH_OFFICIAL={apps:'Вопросы эксплуатации серверов приложений',cluster:'Вопросы эксплуатации кластера серверов',dbms:'Вопросы эксплуатации серверов СУБД',qa:'Обеспечение качества и инструменты обеспечения качества',perf:'Производительность',query:'Запросы и методы их оптимизации',idx:'Индексы',trans:'Транзакции',locks:'Блокировки, избыточные блокировки и методы оптимизации',dead:'Взаимоблокировки и методы их исправления',load:'Нагрузочное тестирование',invperf:'Методики расследования проблем производительности',invpar:'Методики расследования проблем параллельной работы',std:'Стандарты разработки',my:'Мои вопросы'};
function exportCustom(){

async function downloadJson(){
  const txt=exportCustom();
  const name=(curTest().name||'test').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80)+'.json';

    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();

    case 'closeYes':exitMode();break;
    case 'closeNo':ui.closeConfirm=false;render();break;
    case 'scopeAll':setScope([]);render();break;
    case 'scopeToggle':{const s=getScope().slice();const i=s.indexOf(v);if(i>=0)s.splice(i,1);else s.push(v);setScope(s);render();break;}
    case 'scopeOnly':P.settings.starOnly=false;setScope([v]);render();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'batch':P.settings.batch=+v;persist('p');render();break;
    case 'star':toggleStar(t.dataset.id);
      if(!ui.mode&&ui.view==='bank') renderBankList();
      else document.querySelectorAll('.star[data-id="'+CSS.escape(t.dataset.id)+'"]').forEach(function(b){const on=isStar(t.dataset.id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
      break;
    case 'flip':flipCard();break;
    case 'cardMark':cardMark(v==='1');break;
    case 'cardUndo':cardUndo();break;
    case 'cardsAgain':startCards(ui.cards.learn.slice());break;
    case 'cardsRestart':startCards();break;
    case 'toLearn':startLearn(scopeQs(),'Заучивание');break;
    case 'learnAns':learnAnswer(k);break;
    case 'learnSkip':learnAnswer(-1);break;
    case 'learnNext':learnNext();break;
    case 'learnRound':learnRound();break;
    case 'testStart':startExam();break;
    case 'testPick':testPick(+t.dataset.q,k);break;
    case 'askFinish':ui.examConfirm=true;render();window.scrollTo(0,0);break;
    case 'cancelFinish':ui.examConfirm=false;render();break;
    case 'finishExam':finishExam();break;
    case 'testNew':ui.exam=null;render();window.scrollTo(0,0);break;
    case 'testRetry':{const e=ui.exam;const list=e.items.filter(function(it,i){return e.picks[i]!==QMAP[it.id].a;}).map(function(it){return QMAP[it.id];});ui.exam=null;startLearn(list,'Ошибки экзамена');break;}
    case 'jump':{const el=document.getElementById('rv-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'resetExamSettings':Object.assign(P.settings,{count:14,minutes:30,pass:12});persist('p');render();break;
    case 'termToggle':ui.bank.open=ui.bank.open===t.dataset.id?null:t.dataset.id;ui.bank.delOne=null;renderBankList();break;
    case 'selMode':ui.bank.selecting=!ui.bank.selecting;ui.bank.sel={};ui.bank.confirmSel=false;ui.bank.msg='';render();break;
    case 'import':doImport();break;
    case 'delOne':ui.bank.delOne=t.dataset.id;ui.bank.open=t.dataset.id;ui.bank.msg='';renderBankList();break;
    case 'delOneNo':ui.bank.delOne=null;renderBankList();break;
    case 'delOneYes':deleteQuestions([t.dataset.id]);break;
    case 'delSel':ui.bank.confirmSel=true;ui.bank.msg='';renderBankList();break;
    case 'delSelNo':ui.bank.confirmSel=false;renderBankList();break;
    case 'delSelYes':deleteQuestions(Object.keys(ui.bank.sel));break;
    case 'selClear':ui.bank.sel={};ui.bank.confirmSel=false;renderBankList();break;
    case 'restoreHidden':P.hidden=[];reindex();persist('p');ui.bank.msg='Встроенные вопросы возвращены.';render();break;
    case 'copyCustom':{
      const txt=exportCustom();
      const done=function(ok){ui.copyMsg=ok?'Скопировано в буфер обмена.':'Не удалось скопировать. JSON вставлен в поле выше, скопируйте его вручную.';if(!ok)ui.imp.text=txt;render();if(!ok){const ta=document.getElementById('imp');if(ta){ta.focus();ta.select();}}};
      try{navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});}catch(e){done(false);}
      break;}
    case 'delCustom':ui.confirmDel=true;render();break;
    case 'delCustomNo':ui.confirmDel=false;render();break;
    case 'delCustomYes':{const now=Date.now(),ss=syncState();custom.forEach(function(q){if(qTest(q)===ui.test){delete ss.d.questions[q.id];ss.delQ[q.id]=now;}});}custom=custom.filter(function(q){return qTest(q)!==ui.test;});reindex();ui.confirmDel=false;persist('c');render();break;
    case 'reset':ui.confirmReset=true;render();break;
    case 'resetNo':ui.confirmReset=false;render();break;
    case 'resetYes':{testQs(ui.test).forEach(function(q){delete P.stats[q.id];mark('progress',q.id);});P.exams=P.exams.filter(function(x){return (x.t||TECH_ID)!==ui.test;});ui.confirmReset=false;persist('p');render();break;}
  }
});
document.addEventListener('submit',function(ev){
  if(ev.target&&ev.target.id==='tf'){ev.preventDefault();saveTestForm();}
  else if(ev.target&&ev.target.id==='authf'){ev.preventDefault();authAction(false);}
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible') sync();});
document.addEventListener('input',function(ev){
  const t=ev.target;
  if(t.id==='bank-q'){ui.bank.q=t.value;ui.bank.sel={};ui.bank.confirmSel=false;ui.bank.msg='';renderBankList();}
  else if(t.id==='imp'){ui.imp.text=t.value;}
});
document.addEventListener('change',function(ev){
  const t=ev.target;
  if(t.id==='imp-file'){const fl=t.files;importFiles(fl).finally(function(){t.value='';});return;}
  if(t.dataset&&t.dataset.setting){P.settings[t.dataset.setting]=t.checked;persist('p');render();return;}
  if(t.id==='bank-s'||t.id==='bank-f'){ui.bank[t.id==='bank-s'?'s':'f']=t.value;ui.bank.sel={};ui.bank.confirmSel=false;ui.bank.msg='';renderBankList();}
  else if(t.classList&&t.classList.contains('bqsel')){const id=t.dataset.id;if(t.checked)ui.bank.sel[id]=1;else delete ui.bank.sel[id];ui.bank.confirmSel=false;renderBankList();}
  else if(t.id==='bank-all'){const sel={};if(t.checked)bankFiltered().forEach(function(q){sel[q.id]=1;});ui.bank.sel=sel;ui.bank.confirmSel=false;renderBankList();}
  else if(t.dataset&&t.dataset.set){
    const total=allQ().length,key=t.dataset.set;
    let val=Math.round(+t.value);
    const max=key==='minutes'?180:total;
    if(!(val>=1)) val=DEF_SETTINGS[key];
    val=Math.min(max,val);
    P.settings[key]=val;
    if(P.settings.pass>P.settings.count) P.settings.pass=P.settings.count;
    persist('p');render();
  }
});
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(ev){const pnl=ev.target.closest&&ev.target.closest('#imp-panel');if(!pnl)return;ev.preventDefault();pnl.classList.add('drag');});});
document.addEventListener('dragleave',function(ev){const pnl=ev.target.closest&&ev.target.closest('#imp-panel');if(pnl&&!pnl.contains(ev.relatedTarget))pnl.classList.remove('drag');});
document.addEventListener('drop',function(ev){const pnl=ev.target.closest&&ev.target.closest('#imp-panel');if(!pnl)return;ev.preventDefault();pnl.classList.remove('drag');importFiles(ev.dataTransfer&&ev.dataTransfer.files);});
document.addEventListener('keydown',function(ev){
  if(ev.target&&ev.target.getAttribute&&ev.target.getAttribute('for')==='imp-file'&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();document.getElementById('imp-file').click();return;}
  const tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||ev.metaKey||ev.ctrlKey||ev.altKey) return;
  if(ev.key==='Escape'&&ui.mode){ev.preventDefault();requestClose();return;}
  const d=/^[1-9]$/.test(ev.key)?(+ev.key-1):-1;
  if(ui.mode==='cards'&&ui.cards&&ui.cards.i<ui.cards.ids.length){
    if(ev.key===' '||ev.key==='Enter'||ev.key==='ArrowUp'||ev.key==='ArrowDown'){ev.preventDefault();flipCard();}
    else if(ev.key==='ArrowLeft'){ev.preventDefault();cardMark(false);}
    else if(ev.key==='ArrowRight'){ev.preventDefault();cardMark(true);}
    else if(ev.key==='z'||ev.key==='я'||ev.key==='Backspace'){ev.preventDefault();cardUndo();}
  }else if(ui.mode==='learn'&&ui.learn){
    const L=ui.learn;
    if(L.phase==='q'&&d>=0){ev.preventDefault();learnAnswer(d);}
    else if(L.phase==='fb'&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();learnNext();}
    else if(L.phase==='roundEnd'&&ev.key==='Enter'){ev.preventDefault();learnRound();}
  }
});

/* ---------- Запуск ---------- */
(function boot(){
  const saved=lsLoad();
  if(saved){P=normalizeP(saved.progress);if(Array.isArray(saved.custom)) custom=saved.custom.filter(function(q){return q&&q.id&&Array.isArray(q.o);});}
  reindex();
  const h=(location.hash||'').slice(1);
  loadSession();
  render();
  sync();
})();
})();
</script>
